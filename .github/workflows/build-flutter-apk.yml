name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cinetracker_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Dart Installation
        run: flutter --version

      - name: Verify AI Handoff Documents Integrity
        run: |
          test -f ../HANDOFF.md || (echo "Missing root HANDOFF.md!" && exit 1)
          test -f HANDOFF.md || (echo "Missing cinetracker_flutter/HANDOFF.md!" && exit 1)
          test -f ../AGENTS.md || (echo "Missing root AGENTS.md!" && exit 1)
          echo "All AI Handoff and workflow rule documents verified successfully."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (static verification)
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Configure Android Release Signing Keystore from Repository Secrets
        if: ${{ secrets.KEYSTORE_BASE64 != '' || secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Decoding release signing keystore from repository secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          echo "Generating android/key.properties..."
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          cp android/key.properties android/app/key.properties
          echo "Keystore and key.properties configured successfully."

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-flutter-release-apk
          path: cinetracker_flutter/build/app/outputs/flutter-apk/*.apk
          retention-days: 30
