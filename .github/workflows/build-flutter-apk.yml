name: Build Flutter Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Flutter Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cinetracker_flutter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Verify Flutter & Dart Installation
        run: flutter --version

      - name: Verify AI Handoff Documents Integrity
        run: |
          test -f ../HANDOFF.md || (echo "Missing root HANDOFF.md!" && exit 1)
          test -f HANDOFF.md || (echo "Missing cinetracker_flutter/HANDOFF.md!" && exit 1)
          test -f ../AGENTS.md || (echo "Missing root AGENTS.md!" && exit 1)
          echo "All AI Handoff and workflow rule documents verified successfully."

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (static verification)
        run: flutter analyze

      - name: Run automated test suite
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-flutter-release-apk
          path: cinetracker_flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
