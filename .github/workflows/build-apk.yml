name: Build React Native Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Android Native Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK (Release & Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon || ./gradlew assembleRelease --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinetracker-android-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
